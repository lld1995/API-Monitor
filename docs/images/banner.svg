<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E1A"/>
      <stop offset="0.5" stop-color="#0C1628"/>
      <stop offset="1" stop-color="#101F3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#182C4E" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="600" cy="60" rx="420" ry="150" fill="#2E7FD6" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="220" cy="300" rx="260" ry="120" fill="#6366F1" opacity="0.07" filter="url(#soft)"/>
  <ellipse cx="1000" cy="300" rx="260" ry="120" fill="#38BDF8" opacity="0.06" filter="url(#soft)"/>

  <!-- Logo -->
  <g transform="translate(600,92)">
    <rect x="-30" y="-30" width="60" height="60" rx="13" transform="rotate(45)" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="-16" y="-16" width="32" height="32" rx="8" transform="rotate(45)" fill="url(#accent)"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="196" text-anchor="middle" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="1">API <tspan fill="#5EA2E8">Monitor</tspan></text>

  <!-- 渐变短线 -->
  <rect x="568" y="218" width="64" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- 标语 -->
  <text x="600" y="262" text-anchor="middle" font-size="19" fill="#8FA3BF" letter-spacing="4">自部署 API 监控平台</text>
</svg>
